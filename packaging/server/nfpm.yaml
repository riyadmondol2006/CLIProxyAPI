# Headless server package for CLIProxyAPI: the proxy, a systemd system service, and the
# web control panel. Built by .github/workflows/packages.yml from the repository root:
#   nfpm pkg --packager deb|rpm --config packaging/server/nfpm.yaml
# Needs dist/cli-proxy-api and desktop/frontend/dist/index.html (the control panel).
name: cliproxyapi-server
arch: ${NFPM_ARCH}
platform: linux
version: ${VERSION}
version_schema: none
release: "1"
section: net
priority: optional
maintainer: riyadmondol2006 <riyadmondol2006@users.noreply.github.com>
description: |
  Self-hosted AI API gateway for servers.
  Turns your Claude, Codex, Gemini, Kimi, xAI and other accounts and API keys into one
  OpenAI/Anthropic/Gemini-compatible API. Runs cli-proxy-api as the cliproxyapi-server
  system service with a web control panel on port 8317. No desktop dependencies.
vendor: riyadmondol2006
homepage: https://github.com/riyadmondol2006/CLIProxyAPI
license: MIT

# Both packages ship /usr/bin/cli-proxy-api.
conflicts:
  - cliproxyapi

depends:
  - ca-certificates

contents:
  - src: dist/cli-proxy-api
    dst: /usr/bin/cli-proxy-api
    file_info: { mode: 0755 }
  - src: packaging/server/cliproxyapi-server.service
    dst: /usr/lib/systemd/system/cliproxyapi-server.service
    file_info: { mode: 0644 }
  - src: desktop/frontend/dist/index.html
    dst: /usr/share/cliproxyapi/management.html
    file_info: { mode: 0644 }
  # Template for /etc/cliproxyapi/config.yaml, which postinstall creates only if missing.
  - src: packaging/server/config.yaml
    dst: /usr/share/cliproxyapi/config.default.yaml
    file_info: { mode: 0644 }
  - src: config.example.yaml
    dst: /usr/share/cliproxyapi/config.example.yaml
    file_info: { mode: 0644 }
  - src: LICENSE
    dst: /usr/share/doc/cliproxyapi-server/LICENSE
    file_info: { mode: 0644 }
  - src: README.md
    dst: /usr/share/doc/cliproxyapi-server/README.md
    file_info: { mode: 0644 }

scripts:
  postinstall: packaging/server/scripts/postinstall.sh
  preremove: packaging/server/scripts/preremove.sh
  postremove: packaging/server/scripts/postremove.sh

overrides:
  deb:
    depends:
      - ca-certificates
      - passwd
  rpm:
    depends:
      - ca-certificates
      - shadow-utils
