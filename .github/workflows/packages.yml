name: packages

# Builds the Linux .deb and .rpm packages on every push: the desktop package (proxy + desktop
# app + systemd user service) and the headless server package cliproxyapi-server (proxy +
# systemd system service + web control panel). Packages are attached to the workflow run; each
# push to main also publishes them as a new release, v<version>, and v* tags attach the
# packages to that release. management.html, the web control panel the proxy downloads from
# the latest release, goes with them.
# latest.json, the update feed the desktop app checks, goes with the packages and into the
# "latest-build" pre-release, the feed URL that installed apps read.
# The Docker image ghcr.io/<owner>/cliproxyapi is built for main and v* tags; it does not
# hold up the packages.

on:
  push:
    branches:
      - '**'
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: packages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build linux-${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-22.04
          - arch: arm64
            runner: ubuntu-22.04-arm
    # Ubuntu 22.04 keeps the glibc baseline low enough for older distributions.
    runs-on: ${{ matrix.runner }}
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            desktop/go.sum

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: '1.4.3'

      - name: Install WebKitGTK build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential pkg-config libgtk-3-dev libwebkit2gtk-4.1-dev

      - name: Compute version
        id: version
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="0.$(date -u +%Y%m%d).${GITHUB_RUN_NUMBER}"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "Package version: ${version}"

      - name: Refresh model catalogs
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Test desktop backend
        working-directory: desktop
        run: go test ./internal/...

      - name: Test and build the app UI
        working-directory: desktop/frontend
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bun install --frozen-lockfile
          bun run test
          bun run build

      - name: Build proxy
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          CGO_ENABLED=1 go build -trimpath \
            -ldflags "-s -w -X main.Version=${VERSION} -X main.Commit=$(git rev-parse --short HEAD) -X main.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            -o dist/cli-proxy-api ./cmd/server

      - name: Build desktop app
        working-directory: desktop
        env:
          VERSION: ${{ steps.version.outputs.version }}
          UPDATE_FEED: https://github.com/${{ github.repository }}/releases/download/latest-build/latest.json
        run: |
          CGO_ENABLED=1 go build -trimpath -tags desktop,production,webkit2_41 \
            -ldflags "-s -w -X main.version=${VERSION} -X main.updateFeed=${UPDATE_FEED}" \
            -o ../dist/cliproxyapi-desktop .

      - name: Build .deb and .rpm
        env:
          VERSION: ${{ steps.version.outputs.version }}
          NFPM_ARCH: ${{ matrix.arch }}
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.43.0
          # Desktop package (cliproxyapi) and server package (cliproxyapi-server).
          for config in packaging/nfpm.yaml packaging/server/nfpm.yaml; do
            for packager in deb rpm; do
              "$(go env GOPATH)/bin/nfpm" pkg --packager "$packager" --config "$config" --target dist/
            done
          done
          ls -la dist

      - name: Upload packages
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-linux-${{ matrix.arch }}
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error

      # The web control panel, published as management.html: the proxy downloads it from the
      # latest release by that name. It is the same on every arch, so upload it once.
      - name: Copy the control panel
        if: matrix.arch == 'amd64'
        run: cp desktop/frontend/dist/index.html dist/management.html

      - name: Upload the control panel artifact
        if: matrix.arch == 'amd64'
        uses: actions/upload-artifact@v7
        with:
          name: cliproxyapi-management-html
          path: dist/management.html
          if-no-files-found: error

  publish:
    name: publish packages
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
      # The release the packages go to: the tag itself for v* tags; empty for main, which
      # gets a new v<version> release.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Recent commit subjects become the notes in the update feed.
          fetch-depth: 30

      # Only the packages and the control panel: the docker jobs upload digest artifacts at
      # the same time, and everything in packages/ is attached to the release.
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          path: packages
          pattern: cliproxyapi-*
          merge-multiple: true

      # latest.json is the update feed the desktop app checks (desktop/internal/app/update.go).
      # This step fails, and no release is created or changed, unless every package is present.
      - name: Generate the update feed
        id: feed
        run: |
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, re, subprocess, sys

          repo = os.environ["GITHUB_REPOSITORY"]
          sha = os.environ["GITHUB_SHA"]
          # nfpm file names: cliproxyapi-<version>-<release>.<arch>.rpm, cliproxyapi_<version>-<release>_<arch>.deb
          # The feed lists only the desktop package (cliproxyapi); the server package
          # (cliproxyapi-server) is checked separately below.
          patterns = {
              "rpm": re.compile(r"^cliproxyapi-(?P<version>[0-9].*)-(?P<release>[^-]+)\.(?P<arch>x86_64|aarch64)\.rpm$"),
              "deb": re.compile(r"^cliproxyapi_(?P<version>[0-9].*)-(?P<release>[^-]+)_(?P<arch>amd64|arm64)\.deb$"),
          }
          server_patterns = {
              "rpm": re.compile(r"^cliproxyapi-server-(?P<version>[0-9].*)-(?P<release>[^-]+)\.(?P<arch>x86_64|aarch64)\.rpm$"),
              "deb": re.compile(r"^cliproxyapi-server_(?P<version>[0-9].*)-(?P<release>[^-]+)_(?P<arch>amd64|arm64)\.deb$"),
          }
          arches = {"x86_64": "amd64", "aarch64": "arm64", "amd64": "amd64", "arm64": "arm64"}

          assets, versions = [], set()
          server_found, server_versions = [], set()
          for path in sorted(pathlib.Path("packages").iterdir()):
              fmt = path.suffix.lstrip(".")
              if fmt not in patterns:
                  continue
              server = server_patterns[fmt].match(path.name)
              if server:
                  server_found.append((fmt, arches[server["arch"]]))
                  server_versions.add(re.sub(r"[~_]", "-", server["version"]))
                  continue
              match = patterns[fmt].match(path.name)
              if not match:
                  sys.exit(f"unexpected package name: {path.name}")
              # rpm versions cannot contain "-", so a prerelease tag may show up there as "~" or "_".
              versions.add(re.sub(r"[~_]", "-", match["version"]))
              assets.append({
                  "name": path.name,
                  "format": fmt,
                  "arch": arches[match["arch"]],
                  "size": path.stat().st_size,
                  "sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              })

          expected = {(fmt, arch) for fmt in ("rpm", "deb") for arch in ("amd64", "arm64")}
          found = [(asset["format"], asset["arch"]) for asset in assets]
          if sorted(found) != sorted(expected):
              sys.exit(f"expected one package per format and arch, found {sorted(a['name'] for a in assets)}")
          if len(versions) != 1:
              sys.exit(f"the packages disagree on the version: {sorted(versions)}")
          if sorted(server_found) != sorted(expected):
              sys.exit(f"expected one server package per format and arch, found {sorted(server_found)}")
          if server_versions != versions:
              sys.exit(f"the server packages disagree on the version: {sorted(server_versions)} vs {sorted(versions)}")
          if not pathlib.Path("packages/management.html").is_file():
              sys.exit("management.html (the web control panel) is missing")
          version = versions.pop()
          tag = os.environ["RELEASE_TAG"] or f"v{version}"
          download = f"https://github.com/{repo}/releases/download/{tag}/"
          for asset in assets:
              asset["url"] = download + asset["name"]

          notes = subprocess.run(["git", "log", "-n", "15", "--format=%s", sha],
                                 check=True, capture_output=True, text=True).stdout.splitlines()
          feed = {
              "version": version,
              "commit": sha,
              "published": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "release-url": f"https://github.com/{repo}/releases/tag/{tag}",
              "notes": notes,
              "assets": assets,
          }
          out = pathlib.Path(os.environ["RUNNER_TEMP"], "latest.json")
          out.write_text(json.dumps(feed, indent=2) + "\n")
          print(out.read_text())
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write(f"version={version}\ntag={tag}\n")
          PY

      # Tags made with GITHUB_TOKEN start no workflows, so this tag doesn't rebuild anything.
      - name: Publish the release
        if: github.ref == 'refs/heads/main'
        env:
          VERSION: ${{ steps.feed.outputs.version }}
          TAG: ${{ steps.feed.outputs.tag }}
        run: |
          # What's new: the commits since the previous release, or the recent ones for the first.
          previous=$(gh release list --exclude-pre-releases --exclude-drafts --limit 1 --json tagName --jq '.[0].tagName // ""')
          changes=""
          if [[ -n "$previous" && "$previous" != "$TAG" ]]; then
            changes=$(gh api "repos/$GH_REPO/compare/$previous...$GITHUB_SHA" \
              --jq '.commits[] | "- " + (.commit.message | split("\n")[0])' || true)
          fi
          [[ -n "$changes" ]] || changes=$(git log -n 15 --format='- %s' "$GITHUB_SHA")
          cat > "$RUNNER_TEMP/notes.md" <<EOF
          ## What's new

          ${changes}

          ## Install

          Already installed? The app offers this update by itself.

          Otherwise download the file for your computer, then open CLIProxyAPI from your app menu:

          | Computer | Fedora, RHEL (.rpm) | Ubuntu, Debian (.deb) |
          | --- | --- | --- |
          | Most PCs and laptops (Intel or AMD, x86_64) | \`cliproxyapi-${VERSION}-1.x86_64.rpm\` | \`cliproxyapi_${VERSION}-1_amd64.deb\` |
          | ARM (aarch64), e.g. Raspberry Pi | \`cliproxyapi-${VERSION}-1.aarch64.rpm\` | \`cliproxyapi_${VERSION}-1_arm64.deb\` |

          Install with \`sudo dnf install ./cliproxyapi-*.rpm\` or \`sudo apt install ./cliproxyapi_*.deb\`. Not sure which you have? Run \`uname -m\`.

          ## Run on a server

          No desktop needed: the server package runs CLIProxyAPI as a system service with its web control panel on port 8317. On Ubuntu, Debian, Fedora or RHEL (x86_64 or ARM):

          \`\`\`sh
          curl -fsSL https://raw.githubusercontent.com/riyadmondol2006/CLIProxyAPI/main/scripts/install-server.sh | sudo bash
          \`\`\`

          Or with Docker (the first start prints the management key to \`docker logs cliproxyapi\`):

          \`\`\`sh
          docker run -d --name cliproxyapi -p 8317:8317 -v cliproxyapi-data:/data --restart unless-stopped ghcr.io/riyadmondol2006/cliproxyapi:latest
          \`\`\`

          Then open http://<server>:8317 and log in with the management key (\`sudo cat /etc/cliproxyapi/management-key\` shows it again).

          The server packages are \`cliproxyapi-server_${VERSION}-1_amd64.deb\` / \`_arm64.deb\` and \`cliproxyapi-server-${VERSION}-1.x86_64.rpm\` / \`.aarch64.rpm\`; install either these or the desktop package, not both.
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            # A re-run of the same build: replace the files.
            gh release upload "$TAG" packages/* "$RUNNER_TEMP/latest.json" --clobber
          else
            gh release create "$TAG" packages/* "$RUNNER_TEMP/latest.json" \
              --target "$GITHUB_SHA" \
              --title "CLIProxyAPI $VERSION" \
              --notes-file "$RUNNER_TEMP/notes.md" \
              --latest
          fi

      # Installed apps read the feed at latest-build/latest.json; it points at the release above.
      - name: Refresh the update feed
        if: github.ref == 'refs/heads/main'
        run: |
          gh release delete latest-build --cleanup-tag --yes || true
          gh release create latest-build "$RUNNER_TEMP/latest.json" \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Update feed" \
            --notes "The desktop app reads latest.json here to find updates. Download the packages from the latest release: https://github.com/${GH_REPO}/releases/latest"

      - name: Attach packages to the tag release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          # release.yaml creates the release for tags; wait for it before uploading.
          for _ in $(seq 1 30); do
            gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 && break
            sleep 20
          done
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || gh release create "$GITHUB_REF_NAME" --generate-notes
          gh release upload "$GITHUB_REF_NAME" packages/* "$RUNNER_TEMP/latest.json" --clobber

  # Docker image: built natively per arch and pushed by digest, then merged into one
  # multi-arch tag. Same version string as the packages.
  docker:
    name: docker linux-${{ matrix.arch }}
    needs: build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Refresh model catalogs
        run: bash .github/scripts/refresh-model-catalogs.sh

      - name: Image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cliproxyapi" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VERSION=${{ needs.build.outputs.version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.build.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=MIT
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=docker-${{ matrix.arch }}
          cache-to: type=gha,scope=docker-${{ matrix.arch }},mode=max

      - name: Save the digest
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p "$RUNNER_TEMP/digests"
          touch "$RUNNER_TEMP/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@v7
        with:
          name: docker-digest-${{ matrix.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest:
    name: publish docker image
    needs: [build, docker]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: ${{ runner.temp }}/digests
          pattern: docker-digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push the multi-arch tags
        env:
          VERSION: ${{ needs.build.outputs.version }}
        working-directory: ${{ runner.temp }}/digests
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/cliproxyapi"
          # main gets :latest and :<version>; a v* tag gets :<tag version>.
          tags=(-t "$image:$VERSION")
          if [[ "$GITHUB_REF" == "refs/heads/main" ]]; then
            tags+=(-t "$image:latest")
          fi
          sources=()
          for digest in *; do
            sources+=("$image@sha256:$digest")
          done
          [[ ${#sources[@]} -eq 2 ]] || { echo "expected 2 digests, found ${#sources[@]}"; exit 1; }
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$image:$VERSION"
