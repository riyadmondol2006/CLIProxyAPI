# CLIProxyAPI server. Start with:  docker compose up -d
# The first start prints the management key:  docker compose logs cliproxyapi
# Then open http://<this-host>:8317/ and log in with it.
services:
  cliproxyapi:
    image: ghcr.io/riyadmondol2006/cliproxyapi:latest
    # To build from this checkout instead: docker compose up -d --build
    build:
      context: .
      args:
        VERSION: ${VERSION:-dev}
        COMMIT: ${COMMIT:-none}
        BUILD_DATE: ${BUILD_DATE:-unknown}
    container_name: cliproxyapi
    # Optional: the management key for the first start (otherwise one is generated).
    environment:
      CPA_MANAGEMENT_KEY: ${CPA_MANAGEMENT_KEY:-}
    ports:
      - "8317:8317"
    volumes:
      - cliproxyapi-data:/data
    restart: unless-stopped

volumes:
  cliproxyapi-data:
